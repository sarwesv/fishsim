<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0c3c6e" />
  <title>FISH TANK</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 6 8' shape-rendering='crispEdges'><rect x='1' y='2' width='4' height='4' fill='%23ff7b3d'/><rect x='5' y='3' width='1' height='2' fill='%23ff7b3d'/><rect x='0' y='1' width='1' height='6' fill='%23ff7b3d'/><rect x='4' y='3' width='1' height='1' fill='%2320232a'/></svg>" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <!-- ===== Title / selection screen ===== -->
    <section id="title-screen">
      <div class="title-inner">
        <h1 class="game-title">FISH<br />TANK</h1>
        <p class="subtitle">build your aquarium</p>

        <h2 class="section-label">Water</h2>
        <div id="water-select" class="segmented">
          <button data-water="fresh" class="seg">Freshwater</button>
          <button data-water="salt" class="seg">Saltwater</button>
        </div>

        <h2 class="section-label">Starting lineup</h2>
        <div id="lineup" class="lineup"></div>
        <div class="btn-row">
          <button id="browse-btn" class="wide-btn">+ Browse library</button>
          <button id="surprise-btn" class="wide-btn">Surprise me</button>
        </div>

        <h2 class="section-label">Gravel</h2>
        <div id="title-gravel" class="swatches"></div>

        <button id="start-btn" class="start-btn">START</button>
        <p class="hint">move your cursor or finger in the water and a curious fish may swim over</p>
      </div>
    </section>

    <!-- ===== Tank view ===== -->
    <section id="tank-screen" class="hidden">
      <div id="tank-wrap">
        <canvas id="tank"></canvas>
      </div>
      <div id="toolbar">
        <div class="tool-group">
          <button id="add-btn" class="tool">+ ADD</button>
          <button id="surprise-btn2" class="tool" title="Stock random creatures">RND</button>
          <button id="delete-btn" class="tool danger">DEL</button>
        </div>
        <div class="tool-group grow">
          <span class="group-label">Gravel</span>
          <div id="tank-gravel" class="swatches small"></div>
        </div>
        <div class="tool-group">
          <span id="cap" class="cap" title="fish / max"></span>
          <button id="menu-btn" class="tool">MENU</button>
        </div>
      </div>
    </section>

    <!-- ===== Library overlay ===== -->
    <div id="library" class="overlay hidden">
      <div class="lib-panel">
        <div class="lib-head">
          <input id="lib-search" class="lib-search" placeholder="SEARCH..." autocomplete="off" />
          <div id="lib-tabs" class="lib-tabs">
            <button data-water="fresh" class="seg">Fresh</button>
            <button data-water="salt" class="seg">Salt</button>
          </div>
          <button id="lib-close" class="tool" title="Close">X</button>
        </div>
        <div id="lib-grid" class="lib-grid"></div>
      </div>
    </div>

    <div id="toast" class="toast hidden"></div>
  </div>

  <script src="js/vendor/gsap.min.js"></script>
  <script src="js/palette.js"></script>
  <script src="js/creatures.js"></script>
  <script src="js/fish.js"></script>
  <script src="js/koi.js"></script>
  <script src="js/plants.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/tank.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
